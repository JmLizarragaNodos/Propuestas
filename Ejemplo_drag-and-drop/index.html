<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <title>Arrastrar Elementos</title>
  <link rel="shortcut icon" href="https://www.inacap.cl/web/template-aplicaciones/img/favicon.ico" />
  <link rel="stylesheet" href="https://www.inacap.cl/web/template-aplicaciones/css/mdb.min.css">

  <style>
    .malla-curricular .card {
      padding: 8px;
      min-height: 75px;
      word-break: normal;
      max-width: 185px;
      justify-content: center;
    }

    .malla-curricular .card:hover {
      background-color: #bac0c2;
      color: #fff;
    }

    .malla-curricular .card.electivo:hover {
      background-color: #e2a77b;
    }

    .dark .malla-curricular .card {
      background-color: #555;
    }

    .dark .malla-curricular .card:hover {
      background-color: #999;
    }

    .dark .malla-curricular .card.electivo:hover {
      background-color: #3D6161 !important;
    }

    .malla-curricular .title .title-semestre {
      background-color: rgb(51, 51, 51);
      color: #fff;
      font-size: 1rem;
    }

    .malla-num span {
      background-color: #666666;
      color: #fff;
      font-size: 10px;
    }

    .col-malla {
      max-width: 200px;
      padding-left: 5px;
      padding-right: 5px;
    }

    .icon-empt,
    .icon-certi {
      height: 18px;
      width: 18px;
      border-radius: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-empt {
      background-color: #000;
    }

    .icon-empt i,
    .icon-certi i {
      color: #fff;
      font-size: 1rem !important;
    }

    .icon-certi.certificado-APP,
    .icon-certi.edit-certificado-APP {
      background-color: #df772a;
    }

    .icon-certi.certificado-intranet,
    .icon-certi.edit-certificado-intranet {
      background-color: #13b326;
    }

    .icon-certi.certificado-adjunto,
    .icon-certi.edit-certificado-adjunto {
      background-color: #EA047E;
    }

    .nombre-asignatura {
      font-size: 14px;
      max-height: 54px;
      font-weight: bold;
      -webkit-line-clamp: 3;
      overflow: hidden;
      text-overflow: ellipsis;
      word-wrap: normal;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      line-height: 1.2;
    }

    .legend {
      font-size: .875rem;
    }

    .box {
      width: 25px;
      height: 25px;
      border-radius: 4px;
    }

    .pre-requisito .box {
      background-color: rgba(21, 101, 192, 0.5);
    }

    .asig-referen .box {
      background-color: rgba(9, 153, 153, 0.5);
    }

    .asig-requisito .box {
      background-color: rgba(76, 175, 80, 0.5);
    }

    .electivos .box {
      background-color: rgba(226, 167, 123, 1);
    }

  </style>
</head>

<body id="appBody" class="d-flex flex-column">

  <div class="page-content">

    <div class="navbar-overlay"></div>

    <div id="menuContent">
      <!-- Loading Overlay -->
      <div class="loading-backdrop" id="loadingOverlay">
        <div class="loading-circle">
          <div class="preloader-wrapper big active">
            <div class="spinner-layer spinner-white-only">
              <div class="circle-clipper left">
                <div class="circle"></div>
              </div>
              <div class="gap-patch">
                <div class="circle"></div>
              </div>
              <div class="circle-clipper right">
                <div class="circle"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <main class="container-fluid">

      <section>

        <div class="card">
          <div class="card-header">
            <div class="row">
              <div class="col-12 d-flex align-items-end justify-content-between">
                <h4 class="float-left heading h4-responsive mb-0">Arrastrar Elementos</h4>
              </div>
            </div>
          </div>
          <div class="card-body malla-curricular">

            <div class="row mb-4">

              <div class="col-12 d-flex justify-content-center">

                <div class="row mb-4" id="contenedor-principal"></div>

              </div>

            </div>
            <div class="row">
              <div class="col-12 d-flex justify-content-center">
                <div id="mostrar-json-string"></div>
              </div>
            </div>

          </div>
          <div class="card-footer">
            <div class="row py-2 flex-row">

              <div class="col col-md-6  d-flex justify-content-start">

              </div>
              <div class="col col-md-6 d-flex justify-content-end">

                <button type="button" onclick="" class="btn btn-outline waves-effect waves-light">
                  <span>Nada</span>
                </button>

                <button type="button" onclick="" class="btn btn-default waves-effect waves-light">
                  <span>Nada</span>
                </button>

              </div>
            </div>
          </div>
        </div>


      </section>

    </main>

  </div>

  <footer class="page-footer">
    <div class="container py-3">
      <div class="d-flex align-items-center justify-content-center justify-content-md-start">
        <div class="logo-gst">
          <img src="http://www.inacap.cl/web/template-aplicaciones/img/logo-gst.png" alt="">
        </div>
        <span class="pl-2 pl-md-4">Gerencia de Sistemas y Tecnolog&iacute;as</span>
      </div>
    </div>
  </footer>


  <script src="https://www.inacap.cl/web/template-aplicaciones/js/jquery-3.3.1.min.js"></script>
  <script src="https://www.inacap.cl/web/template-aplicaciones/js/popper.min.js"></script>
  <script src="https://www.inacap.cl/web/template-aplicaciones/js/bootstrap.min.js"></script>
  <script src="https://www.inacap.cl/web/template-aplicaciones/js/mdb.min.js"></script>
  <script src="https://www.inacap.cl/web/template-aplicaciones/js/chosen.jquery.js"></script>
  <script src="https://www.inacap.cl/web/template-aplicaciones/js/datepicker.js"></script>
  <script src="https://www.inacap.cl/web/template-aplicaciones/js/datatables.min.js"></script>

  <script type="module">
    //import { dragAndDrop } from 'https://cdn.jsdelivr.net/npm/@formkit/drag-and-drop@0.5.3/+esm';
    import { dragAndDrop } from './drag-and-drop.js';

    $(document).ready(function () {
      //$('[data-toggle="tooltip"]').tooltip();   // Activar tooltips
    });

    let arreglo = [
      {
        codigoContenedor: 1,
        ordenContenedor: 1,
        descripcionContenedor: "frutas",
        detalles: [
          { codigo: 1, descripcion: "🍎 Manzana" },
          { codigo: 2, descripcion: "🍌 Plátano" },
          { codigo: 3, descripcion: "🍇 Uvas" },
          { codigo: 5, descripcion: "🍍 Piña" }
        ]
      },
      {
        codigoContenedor: 2,
        ordenContenedor: 2,
        descripcionContenedor: "verduras",
        detalles: [
          { codigo: 6, descripcion: "🥦 Brócoli" },
          { codigo: 7, descripcion: "🥕 Zanahoria" },
          { codigo: 9, descripcion: "🥬 Lechuga" },
          { codigo: 10, descripcion: "🍅 Tomate" }
        ]
      },
      {
        codigoContenedor: 3,
        ordenContenedor: 3,
        descripcionContenedor: "carnes",
        detalles: [
          { codigo: 11, descripcion: "🥩 Bistec" },
          { codigo: 12, descripcion: "🍗 Pollo" },
          { codigo: 13, descripcion: "🥓 Tocino" },
          { codigo: 14, descripcion: "🦐 Camarón" }
        ]
      },
      {
        codigoContenedor: 4,
        ordenContenedor: 4,
        descripcionContenedor: "bebidas",
        detalles: [
          { codigo: 16, descripcion: "🥤 Refresco" },
          { codigo: 17, descripcion: "☕ Café" },
          { codigo: 18, descripcion: "🍵 Té" },
          { codigo: 20, descripcion: "🍺 Cerveza" }
        ]
      }
    ];

    const contenedorPrincipal = document.querySelector("#contenedor-principal");

    function obtenerHtmlItem(item)
    {
      return `
      <div class="item-arrastrable col-12 p-1" data-codigo="${item.codigo}" draggable="true">
        <div class="card mb-2 text-center">
          <div class="card-body my-2">
            <h5 class="nombre-asignatura">${item.descripcion}</h5>
            <div class="card-actions d-flex justify-content-between flex-row my-3">
              <div class="card-asignatura-empt d-flex justify-content-start my-2">
                <div class="icon-empt" data-toggle="tooltip" data-placement="bottom" title="Asignatura con articulación EMPT">
                  <i class="material-icons icon-lg">insert_link</i>
                </div>
              </div>
              <div class="d-flex flex-row ml-auto flex-wrap">
                <div class="card-asignatura-certificado d-flex justify-content-end my-2 mr-1">
                  <div class="icon-certi certificado-intranet" data-toggle="tooltip"
                    data-placement="bottom" title="certificado-intranet">
                    <i class="material-icons icon-lg">verified</i>
                  </div>
                  <div class="icon-certi certificado-APP" data-toggle="tooltip"
                    data-placement="bottom" title="certificado-APP">
                    <i class="material-icons icon-lg">verified</i>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      `;
    }

    contenedorPrincipal.innerHTML = arreglo.map(c => 
    {
      return `
      <div class="col mb-4 col-malla d-flex flex-column" style="order:1;">

        <div class="title d-flex flex-column mb-1">

          <div class="title-semestre text-center">
            <p class="m-0 p-2">${c.descripcionContenedor}</p>
          </div>

          <div class="malla-num d-flex flex-row mt-1 mb-2">
            <span class="col mr-1 text-center">ciclo 1</span>
            <span class="col ml-1 text-center">ciclo 2</span>
          </div>

          <div id="items-${c.codigoContenedor}" class="container-card d-flex flex-wrap"
          style="border: 2px dashed #ccc; min-height: 260px">

            ${c.detalles.map(item => 
            {
              return obtenerHtmlItem(item);
            }).join("")}

          </div>
        </div>

      </div>
      `;

    }).join("");

    function render(contenedorId, items) 
    {
      const container = document.querySelector(`#items-${contenedorId}`);

      container.innerHTML = items.map(item => 
      {
        return obtenerHtmlItem(item);
      }).join("");
    }

    arreglo.forEach(categoria => 
    {
      const contenedorId = categoria.codigoContenedor;
      const areaItems = document.getElementById(`items-${contenedorId}`);

      dragAndDrop({
        parent: areaItems,
        getValues: () => {
          return Array.from(areaItems.querySelectorAll(".item-arrastrable")).map(el => {
            const codigo = parseInt(el.getAttribute("data-codigo"));
            return arreglo.flatMap(a => a.detalles).find(i => i.codigo === codigo);
          });
        },
        setValues: (newItems) => {
          categoria.detalles = newItems;
          render(contenedorId, newItems);
          mostrarJsonString();
        },
        config: {
          group: "alimentos"
        }
      });
    });

    function mostrarJsonString() {
      const jsonFormatted = JSON.stringify(arreglo, null, 2);
      document.querySelector("#mostrar-json-string").innerHTML = `<pre>${jsonFormatted}</pre>`;
    }

    mostrarJsonString();
  </script>

</body>

</html>
